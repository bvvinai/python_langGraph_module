version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:v1.13.3
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  neo4j:
    image: neo4j:5.26
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
    volumes:
      - neo4j_data:/data

  api:
    build: .
    env_file:
      - .env
    depends_on:
      - qdrant
      - neo4j
    ports:
      - "8000:8000"

volumes:
  qdrant_data:
  neo4j_data:
