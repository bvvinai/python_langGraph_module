[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-ai-backend"
version = "0.1.0"
description = "Pluggable LangGraph AI backend with RAG, GraphRAG, ingestion, and streaming transports"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "AI Backend Team" }
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "langgraph>=0.2.0",
  "httpx>=0.27.0",
  "openai>=1.35.0",
  "anthropic>=0.34.0",
  "google-genai>=0.7.0",
  "mistralai>=1.2.0",
  "groq>=0.9.0",
  "qdrant-client>=1.10.0",
  "chromadb>=0.5.5",
  "neo4j>=5.23.0",
  "python-multipart>=0.0.9",
  "pypdf>=4.2.0",
  "python-docx>=1.1.2",
  "beautifulsoup4>=4.12.3",
  "lxml>=5.2.2",
  "openpyxl>=3.1.5",
  "extract-msg>=0.48.5"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.8",
  "ruff>=0.5.4",
  "mypy>=1.10.0"
]
grpc = [
  "grpcio>=1.65.0",
  "grpcio-tools>=1.65.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]